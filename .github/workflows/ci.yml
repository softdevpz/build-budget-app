name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budget_app
          POSTGRES_PASSWORD: budget_app_dev
          POSTGRES_DB: budget_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://budget_app:budget_app_dev@localhost:5432/budget_app_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      # Dummy values: the CI test suite doesn't call real AWS/Stripe/SMTP,
      # but StripeService/S3Service construct their clients at app bootstrap
      # (before any test runs), so these just need to be non-empty strings.
      AWS_REGION: eu-central-1
      AWS_S3_BUCKET: ci-placeholder-bucket
      AWS_ACCESS_KEY_ID: ci-placeholder
      AWS_SECRET_ACCESS_KEY: ci-placeholder
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: "CI <ci@example.com>"
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PREMIUM_PRICE_ID: price_ci_placeholder
      API_PORT: 4000
      WEB_PUBLIC_API_URL: http://localhost:4000
      WEB_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate

      - name: Apply migrations to the CI test database
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Build (typecheck)
        run: npm run build:api

      - name: Unit tests (with coverage thresholds)
        run: npm run test:api:cov

      - name: E2E tests
        run: npm run test:api:e2e

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build:web
